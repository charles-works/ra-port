name: Android debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      JAVA_VERSION: '17'
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure SDL Android sources are present
        shell: bash
        run: |
          set -euxo pipefail

          SDL_ACTIVITY="${GITHUB_WORKSPACE}/third_party/SDL/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java"
          if [ ! -f "$SDL_ACTIVITY" ]; then
            rm -rf "${GITHUB_WORKSPACE}/third_party/SDL"
            mkdir -p "${GITHUB_WORKSPACE}/third_party"
            git clone --depth 1 --branch main https://github.com/libsdl-org/SDL.git "${GITHUB_WORKSPACE}/third_party/SDL"
          fi

          test -f "$SDL_ACTIVITY"
          ls -l "$GITHUB_WORKSPACE/third_party/SDL/android-project/app/src/main/java/org/libsdl/app"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android commandline tools
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
            rm -rf latest
            unzip -q -o cmdline-tools.zip
            mv cmdline-tools latest
          fi

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Prepare minimal Red Alert asset stub for build validation
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets/redalert/allies/INSTALL
          printf "[REDALERT]\n" > assets/redalert/allies/INSTALL/REDALERT.INI

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
          validate-wrappers: false

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle -p android :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ra-port-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
