name: Android debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      JAVA_VERSION: '17'
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Prepare minimal Red Alert asset stub for build validation
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets/redalert/allies/INSTALL
          printf "[REDALERT]\n" > assets/redalert/allies/INSTALL/REDALERT.INI

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.1

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle -p android :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ra-port-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
